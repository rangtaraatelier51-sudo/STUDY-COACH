<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Study Coach — Quiz</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">Study Coach</div>
      <nav class="nav">
        <a href="index.html" class="nav-link">Dashboard</a>
        <a href="subjects.html" class="nav-link">Subjects</a>
        <a href="coach.html" class="nav-link">AI Coach</a>
        <a href="quiz.html" class="nav-link active">Quiz</a>
        <a href="focus.html" class="nav-link">Focus Mode</a>
      </nav>
      <div class="sidebar-foot">v1 prototype · ₹0 stack</div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <h1>Quiz</h1>
          <p class="subhead">Test your knowledge with adaptive questions.</p>
        </div>
      </header>

      <div class="quiz-layout">
        <!-- Setup -->
        <div class="quiz-setup" id="quiz-setup">
          <h3>Start a quiz</h3>

          <label>Subject</label>
          <select id="quiz-subject">
            <option value="">Select a subject</option>
          </select>
          <div class="modal-empty-note" id="quiz-no-subjects">
            <strong>No subjects yet.</strong> <a href="subjects.html">Create one first</a>.
          </div>

          <label>Chapter</label>
          <select id="quiz-chapter">
            <option value="">All chapters</option>
          </select>

          <label>Difficulty</label>
          <select id="quiz-difficulty">
            <option value="easy">Easy</option>
            <option value="medium" selected>Medium</option>
            <option value="hard">Hard</option>
          </select>

          <label>Number of questions</label>
          <select id="quiz-count">
            <option value="5">5 questions</option>
            <option value="10" selected>10 questions</option>
            <option value="15">15 questions</option>
            <option value="20">20 questions</option>
          </select>

          <button class="btn-primary" id="start-quiz-btn" style="width: 100%; margin-top: 16px;">Start quiz</button>
        </div>

        <!-- Quiz view -->
        <div class="quiz-view" id="quiz-view" style="display: none;">
          <div class="quiz-header">
            <h3>Quiz in progress</h3>
            <div class="quiz-progress">
              <span id="quiz-progress">1 of 10</span>
              <div class="quiz-progress-bar">
                <div class="quiz-progress-fill" id="quiz-progress-fill"></div>
              </div>
            </div>
          </div>

          <div class="quiz-question-card">
            <div class="question-number" id="question-number">Q1</div>
            <div class="question-text" id="question-text">Loading question...</div>
            <div class="question-options" id="question-options"></div>
            <div class="question-feedback" id="question-feedback" style="display: none;"></div>
          </div>

          <div class="quiz-actions">
            <button class="btn-text" id="quiz-back-btn">Back to setup</button>
            <button class="btn-primary" id="quiz-next-btn">Next question</button>
          </div>
        </div>

        <!-- Results -->
        <div class="quiz-results" id="quiz-results" style="display: none;">
          <div class="results-card">
            <h3>Quiz complete!</h3>
            <div class="results-score">
              <div class="score-circle">
                <div class="score-number" id="results-score">—</div>
              </div>
            </div>
            <p class="results-detail" id="results-detail">You answered all questions.</p>
            <div class="result-meta" id="results-breakdown"></div>
            <div class="results-actions">
              <button class="btn-ghost" id="retake-btn">Retake quiz</button>
              <button class="btn-primary" id="back-home-btn">Back to setup</button>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
  
<script async src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
  <script src="js/store.js"></script>
  <script src="js/quiz.js"></script>
</body>
</html>
