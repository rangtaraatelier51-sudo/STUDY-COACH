<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Study Coach — Login</title>
<link rel="stylesheet" href="css/style.css" />
<style>
  .auth-container {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    background: var(--ink);
  }
  .auth-card {
    background: var(--panel);
    border: 1px solid var(--rule);
    border-radius: 8px;
    padding: 40px;
    width: 100%;
    max-width: 380px;
  }
  .auth-card h1 {
    font-size: 24px;
    margin: 0 0 8px;
    text-align: center;
  }
  .auth-card .auth-subtitle {
    text-align: center;
    color: var(--muted);
    font-size: 13px;
    margin-bottom: 24px;
  }
  .auth-form {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .auth-form label {
    font-size: 12px;
    color: var(--muted);
    margin-top: 4px;
  }
  .auth-form input {
    background: var(--panel-raised);
    border: 1px solid var(--rule);
    color: var(--paper);
    border-radius: 3px;
    padding: 10px 11px;
    font-size: 13.5px;
  }
  .auth-form input:focus {
    outline: 2px solid var(--amber);
  }
  .auth-button {
    background: var(--amber);
    color: #241a06;
    border: none;
    border-radius: 3px;
    padding: 10px 14px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 8px;
  }
  .auth-button:hover {
    opacity: 0.9;
  }
  .auth-button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }
  .auth-toggle {
    text-align: center;
    font-size: 13px;
    color: var(--muted);
    margin-top: 16px;
  }
  .auth-toggle button {
    background: none;
    border: none;
    color: var(--amber);
    cursor: pointer;
    font-size: 13px;
  }
  .auth-error {
    background: rgba(224, 122, 99, 0.1);
    border: 1px solid var(--rose);
    border-radius: 3px;
    padding: 10px;
    font-size: 12px;
    color: var(--rose);
    margin-bottom: 10px;
    display: none;
  }
  .auth-loading {
    text-align: center;
    font-size: 12px;
    color: var(--muted);
    display: none;
  }
</style>
</head>
<body>

  <div class="auth-container">
    <div class="auth-card">
      <h1>Study Coach</h1>
      <p class="auth-subtitle">Master your exams, own your time.</p>

      <div class="auth-error" id="auth-error"></div>
      <div class="auth-loading" id="auth-loading">Loading...</div>

      <!-- Login form -->
      <form class="auth-form" id="login-form">
        <label>Email</label>
        <input type="email" id="login-email" placeholder="you@example.com" required />
        <label>Password</label>
        <input type="password" id="login-password" placeholder="••••••••" required />
        <button class="auth-button" type="submit">Sign in</button>
      </form>

      <!-- Signup form (hidden by default) -->
      <form class="auth-form" id="signup-form" style="display: none;">
        <label>Email</label>
        <input type="email" id="signup-email" placeholder="you@example.com" required />
        <label>Password</label>
        <input type="password" id="signup-password" placeholder="••••••••" required />
        <label>Confirm password</label>
        <input type="password" id="signup-password-confirm" placeholder="••••••••" required />
        <button class="auth-button" type="submit">Create account</button>
      </form>

      <div class="auth-toggle">
        <span id="toggle-text">Don't have an account?</span>
        <button type="button" id="toggle-form">Sign up</button>
      </div>
    </div>
  </div>

  <script src="js/supabase.js"></script>
  <script>
    const loginForm = document.getElementById("login-form");
    const signupForm = document.getElementById("signup-form");
    const toggleBtn = document.getElementById("toggle-form");
    const toggleText = document.getElementById("toggle-text");
    const errorDiv = document.getElementById("auth-error");
    const loadingDiv = document.getElementById("auth-loading");

    // Check if already logged in
    window.supabaseReady().then(() => {
      const user = window.supabaseUser;
      if (user) {
        window.location.href = "index.html";
      }
    });

    toggleBtn.addEventListener("click", () => {
      const isLoginShown = loginForm.style.display !== "none";
      if (isLoginShown) {
        loginForm.style.display = "none";
        signupForm.style.display = "flex";
        toggleText.textContent = "Already have an account?";
        toggleBtn.textContent = "Sign in";
      } else {
        loginForm.style.display = "flex";
        signupForm.style.display = "none";
        toggleText.textContent = "Don't have an account?";
        toggleBtn.textContent = "Sign up";
      }
      errorDiv.style.display = "none";
    });

    loginForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("login-email").value;
      const password = document.getElementById("login-password").value;

      errorDiv.style.display = "none";
      loadingDiv.style.display = "block";

      try {
        await window.supabaseSignIn(email, password);
        window.location.href = "index.html";
      } catch (err) {
        errorDiv.textContent = err.message || "Login failed";
        errorDiv.style.display = "block";
      } finally {
        loadingDiv.style.display = "none";
      }
    });

    signupForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("signup-email").value;
      const password = document.getElementById("signup-password").value;
      const confirmPassword = document.getElementById("signup-password-confirm").value;

      if (password !== confirmPassword) {
        errorDiv.textContent = "Passwords don't match";
        errorDiv.style.display = "block";
        return;
      }

      errorDiv.style.display = "none";
      loadingDiv.style.display = "block";

      try {
        await window.supabaseSignUp(email, password);
        errorDiv.style.display = "none";
        errorDiv.textContent = "Account created! You can now sign in.";
        errorDiv.style.background = "rgba(127, 182, 158, 0.1)";
        errorDiv.style.borderColor = "var(--sage)";
        errorDiv.style.color = "var(--sage)";
        errorDiv.style.display = "block";
        signupForm.reset();
        setTimeout(() => {
          loginForm.style.display = "flex";
          signupForm.style.display = "none";
          toggleText.textContent = "Don't have an account?";
          toggleBtn.textContent = "Sign up";
        }, 2000);
      } catch (err) {
        errorDiv.textContent = err.message || "Signup failed";
        errorDiv.style.display = "block";
      } finally {
        loadingDiv.style.display = "none";
      }
    });
  </script>
</body>
</html>
