<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Timetable Generator | Study Coach</title>

 <style>
</head>

   
<body>

  <div class="container">

    <h1>📅 Timetable Generator</h1>
    <p class="subtitle">
      Create a study timetable based on your available time.
    </p>

    <div class="card">

      <h2>Build Your Timetable</h2>

      <label for="hours">
        Study hours per day
      </label>

      <input
        type="number"
        id="hours"
        min="1"
        max="12"
        value="3"
      />

      <label for="days">
        Number of study days
      </label>

      <input
        type="number"
        id="days"
        min="1"
        max="7"
        value="7"
      />

      <label for="startTime">
        Start time
      </label>

      <input
        type="time"
        id="startTime"
        value="17:00"
      />

      <button id="generateBtn">
        Generate Timetable
      </button>

    </div>

    <div class="card">

      <h2>Your Timetable</h2>

      <div id="timetable">
        <p class="empty">
          Your timetable will appear here.
        </p>
      </div>

    </div>

  </div>

  <script src="store.js"></script>
  <script src="timetable.js"></script>

</body>
</html>
