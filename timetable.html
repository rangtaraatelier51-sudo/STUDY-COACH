<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Timetable Generator | Study Coach</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      background: #10111b;
      color: #f5f5f7;
      font-family: Arial, sans-serif;
    }

    .container {
      max-width: 1050px;
      margin: 0 auto;
      padding: 45px 40px;
    }

    h1 {
      font-family: Georgia, serif;
      font-size: 34px;
      margin: 0 0 8px;
      color: #f4f4f6;
    }

    .subtitle {
      color: #8d91a5;
      margin-bottom: 30px;
    }

    .card {
      background: #171925;
      border: 1px solid #2b3045;
      border-radius: 5px;
      padding: 26px;
      margin-bottom: 22px;
    }

    h2 {
      font-family: Georgia, serif;
      font-size: 22px;
      margin-top: 0;
      color: #f4f4f6;
    }

    label {
      display: block;
      margin-top: 18px;
      margin-bottom: 8px;
      color: #d7d8df;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 12px;
      background: #11121d;
      color: #f5f5f7;
      border: 1px solid #30354b;
      border-radius: 5px;
      outline: none;
    }

    input:focus {
      border-color: #e9a52b;
    }

    button {
      margin-top: 22px;
      padding: 11px 18px;
      background: transparent;
      color: #e9a52b;
      border: 1px solid #e9a52b;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
    }

    button:hover {
      background: #e9a52b;
      color: #10111b;
    }

    .day {
      margin-top: 22px;
      padding: 18px;
      background: #1a1d2b;
      border: 1px solid #2d3349;
      border-radius: 5px;
    }

    .day h3 {
      margin: 0 0 14px;
      font-family: Georgia, serif;
      color: #e9a52b;
    }

    .study-session {
      display: flex;
      align-items: center;
      gap: 20px;
      background: #12141f;
      border: 1px solid #292e43;
      padding: 13px 15px;
      margin-top: 8px;
      border-radius: 4px;
    }

    .session-time {
      min-width: 100px;
      color: #9da2b8;
      font-size: 14px;
    }

    .session-subject {
      color: #f2f2f5;
      font-size: 15px;
    }

    .empty {
      color: #777d92;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>📅 Timetable Generator</h1>

    <p class="subtitle">
      Create a study timetable based on your available time.
    </p>

    <div class="card">

      <h2>Build Your Timetable</h2>

      <label for="hours">
        Study hours per day
      </label>

      <input
        type="number"
        id="hours"
        min="1"
        max="12"
        value="3"
      />

      <label for="days">
        Number of study days
      </label>

      <input
        type="number"
        id="days"
        min="1"
        max="7"
        value="7"
      />

      <label for="startTime">
        Start time
      </label>

      <input
        type="time"
        id="startTime"
        value="17:00"
      />

      <button id="generateBtn">
        Generate Timetable
      </button>

    </div>

    <div class="card">

      <h2>Your Timetable</h2>

      <div id="timetable">
        <p class="empty">
          Your timetable will appear here.
        </p>
      </div>

    </div>

  </div>

 <script src="js/store.js"></script>
<script src="js/timetable.js"></script>

</body>
</html>
