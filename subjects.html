<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Study Coach — Subjects</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">Study Coach</div>
      <nav class="nav">
        <a href="index.html" class="nav-link">Dashboard</a>
        <a href="subjects.html" class="nav-link active">Subjects</a>
        <a href="coach.html" class="nav-link">AI Coach</a>
        <a href="quiz.html" class="nav-link">Quiz</a>
        <a href="focus.html" class="nav-link">Focus Mode</a>
      </nav>
      <div class="sidebar-foot">
        <button id="logout-btn" class="btn-text" style="width: 100%; text-align: left; padding: 8px 10px;">Sign out</button>
        <div style="font-size: 11px; color: var(--muted); margin-top: 8px;">v1 prototype · ₹0 stack</div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <h1>Subjects</h1>
          <p class="subhead">Organize your study areas. Add chapters to track progress.</p>
        </div>
        <button class="btn-primary" id="add-subject-btn">+ New subject</button>
      </header>

      <div class="subject-grid" id="subject-grid"></div>
      <p class="empty-note" id="subjects-empty" style="margin-top: 20px;">No subjects yet — add one to get started.</p>
    </main>
  </div>

  <!-- Add/edit subject modal -->
  <div class="modal-backdrop" id="subject-modal">
    <div class="modal modal-wide">
      <h3 id="subject-modal-title">Add subject</h3>
      <label>Subject name</label>
      <input type="text" id="subject-name" placeholder="e.g., Physics, Literature" />
      <label>Chapters</label>
      <div class="chapter-rows" id="chapter-rows"></div>
      <button class="btn-text" id="add-chapter-btn" style="margin: 8px 0;">+ Add chapter</button>
      <div class="modal-actions">
        <button class="btn-text" id="close-subject-modal">Cancel</button>
        <button class="btn-primary" id="save-subject-btn">Save</button>
      </div>
    </div>
  </div>

  <script src="js/supabase.js"></script>
  <script src="js/store.js"></script>
  <script src="js/subjects.js"></script>
</body>
</html>
